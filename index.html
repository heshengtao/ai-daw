<!doctype html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI DAW</title>
    <style>
      /* 启动占位：窗口在 `app_ready` 之前是隐藏的，一旦后端兜底定时器（6 s）先把它显示出来，
         而页面脚本还没跑完，用户看到的就是一块纯色。给它一个品牌标记 + 呼吸点，
         至少能区分「正在启动」和「卡死」。
         样式必须内联：这段 HTML 要在 `main.css` 之前就生效；`#app` 会在 Vue 挂载时被清空。 */
      .boot {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        color: #6750a4;
      }
      html.dark .boot {
        color: #d0bcff;
      }
      .boot-mark {
        width: 56px;
        height: 56px;
        border-radius: 16px;
        animation: boot-breathe 2s ease-in-out infinite;
      }
      .boot-dots {
        display: flex;
        gap: 6px;
      }
      .boot-dots span {
        width: 6px;
        height: 6px;
        border-radius: 999px;
        background-color: currentColor;
        opacity: 0.35;
        animation: boot-pulse 1.2s ease-in-out infinite;
      }
      .boot-dots span:nth-child(2) {
        animation-delay: 0.15s;
      }
      .boot-dots span:nth-child(3) {
        animation-delay: 0.3s;
      }
      @keyframes boot-breathe {
        0%,
        100% {
          opacity: 0.85;
          transform: scale(0.97);
        }
        50% {
          opacity: 1;
          transform: scale(1);
        }
      }
      @keyframes boot-pulse {
        0%,
        100% {
          opacity: 0.25;
        }
        50% {
          opacity: 0.9;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-mark,
        .boot-dots span {
          animation: none;
        }
      }
    </style>
  </head>

  <body>
    <div id="app">
      <div class="boot" role="status" aria-label="AI DAW">
        <svg class="boot-mark" viewBox="0 0 1024 1024" aria-hidden="true">
          <rect width="1024" height="1024" rx="232" fill="#6750A4" />
          <g fill="#FFFFFF">
            <rect x="152" y="352" width="120" height="320" rx="60" />
            <rect x="352" y="232" width="120" height="560" rx="60" fill="#FFB74D" />
            <rect x="552" y="292" width="120" height="440" rx="60" />
            <rect x="752" y="392" width="120" height="240" rx="60" />
          </g>
        </svg>
        <div class="boot-dots"><span></span><span></span><span></span></div>
      </div>
    </div>
    <script>
      // 在打包脚本加载前就把底色铺上：否则独立窗口（合成器 / 效果器面板）打开时会先闪一帧白。
      // 这段判断必须与 `composables/useTheme` 保持一致（同一个 localStorage 键、同一个默认值）。
      (function () {
        try {
          var mode = localStorage.getItem("ai-daw-theme") || "dark";
          var dark =
            mode === "dark" ||
            (mode === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.style.backgroundColor = dark ? "#1c1b1f" : "#fef7ff";
          // 启动占位的配色跟着主题走（`useTheme` 挂载后会再设一次同样的值）。
          document.documentElement.classList.toggle("dark", dark);
        } catch (e) {
          /* 隐私模式读不到 localStorage：留着浏览器默认底色就好 */
        }
      })();
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
