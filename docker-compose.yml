services:
  ai-daw:
    build:
      context: .
      dockerfile: Dockerfile
    image: ai-daw:local
    container_name: ai-daw
    # 容器里必须绑 0.0.0.0，端口映射才有意义（Dockerfile 的 ENTRYPOINT 已带 --lan）。
    ports:
      - "28430:28430"
    volumes:
      - ai-daw-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:28430/health"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 25s

volumes:
  ai-daw-data:
