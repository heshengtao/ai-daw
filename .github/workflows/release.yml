name: Release

on:
  push:
    tags:
      - 'v*'

env:
  APP_NAME: AI DAW
  PNPM_VERSION: '10'
  NODE_VERSION: '22'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: linux-amd64
            bundles: --bundles deb,appimage
          - platform: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            artifact: linux-arm64
            bundles: --bundles deb,appimage
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: windows-amd64
            bundles: --bundles msi,nsis
          - platform: macos-latest
            target: aarch64-apple-darwin
            artifact: macos-arm64
            # 同时出 `app`：更新包（`.app.tar.gz`）就是由它生成的（dmg 只是分发外壳）。
            bundles: --bundles dmg,app
          # 没有 Intel macOS（x86_64-apple-darwin）这一档：`ort` 只对 x86_64-apple-darwin
          # **不发预编译的 ONNX Runtime**（`ort-sys: no prebuilt binaries available`），
          # 加进来只会让整个 release 挂掉。要支持得改用 `load-dynamic` 自己带 dylib。

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            src-tauri -> target

      - name: Install Linux dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            pkg-config \
            libclang-dev \
            libasound2-dev \
            libxcb1-dev \
            libxrandr-dev \
            libdbus-1-dev \
            libpipewire-0.3-dev \
            libspa-0.2-dev \
            libwayland-dev \
            libegl-dev \
            libgbm-dev \
            xdg-utils

      - name: Build
        run: pnpm tauri build --target ${{ matrix.target }} ${{ matrix.bundles }}
        env:
          AIDAW_TARGET: ${{ matrix.target }}
          # 更新包签名：私钥 + 口令从仓库 Secrets 读；缺失会让 build 直接失败（有意为之）。
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      # 回归防线：bundle 若没有签名，macOS 会直接判「已损坏」，连「仍要打开」都不给
      # （2026-10 的 1.6.1 就是这样：`bundle.macOS` 整段缺失 → tauri 完全跳过 codesign）。
      # 这里在打包后立刻校验签名完整性，签名缺失/损坏就构建失败，而不是等用户装完才发现。
      - name: Verify macOS bundle signature
        if: startsWith(matrix.platform, 'macos')
        shell: bash
        run: |
          app="src-tauri/target/${{ matrix.target }}/release/bundle/macos/${{ env.APP_NAME }}.app"
          test -d "$app" || { echo "❌ 缺少 app bundle: $app"; exit 1; }
          test -f "$app/Contents/_CodeSignature/CodeResources" || {
            echo "❌ $app 没有 Contents/_CodeSignature，说明打包期签名没执行"
            exit 1
          }
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -dv --verbose=2 "$app" 2>&1 | tee /tmp/codesign.txt
          grep -q 'Signature=adhoc' /tmp/codesign.txt || { echo "❌ 期望 ad-hoc 签名（signingIdentity: \"-\"）"; exit 1; }
          echo "✅ macOS 包签名完整（ad-hoc，未公证：首次打开需「仍要打开」）"

      - name: Collect Linux bundles
        if: startsWith(matrix.platform, 'ubuntu')
        shell: bash
        run: |
          mkdir -p out
          bundle="src-tauri/target/${{ matrix.target }}/release/bundle"
          for f in "$bundle"/deb/*.deb "$bundle"/appimage/*.AppImage; do
            [ -f "$f" ] || continue
            ext="${f##*.}"
            cp "$f" "out/AI-DAW-${{ github.ref_name }}-${{ matrix.artifact }}.${ext}"
          done
          # AppImage 的更新签名（autoupdate 只认 .AppImage + 同名 .sig）。
          for f in "$bundle"/appimage/*.AppImage.sig; do
            [ -f "$f" ] || continue
            cp "$f" "out/AI-DAW-${{ github.ref_name }}-${{ matrix.artifact }}.AppImage.sig"
          done
          ls -la out

      - name: Collect Windows bundles
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out | Out-Null
          $bundle = "src-tauri/target/${{ matrix.target }}/release/bundle"
          Get-ChildItem "$bundle/msi/*.msi" -ErrorAction SilentlyContinue |
            ForEach-Object { Copy-Item $_.FullName "out/AI-DAW-${{ github.ref_name }}-${{ matrix.artifact }}.msi" }
          Get-ChildItem "$bundle/nsis/*-setup.exe" -ErrorAction SilentlyContinue |
            ForEach-Object { Copy-Item $_.FullName "out/AI-DAW-${{ github.ref_name }}-${{ matrix.artifact }}-setup.exe" }
          # NSIS 安装包的更新签名。
          Get-ChildItem "$bundle/nsis/*-setup.exe.sig" -ErrorAction SilentlyContinue |
            ForEach-Object { Copy-Item $_.FullName "out/AI-DAW-${{ github.ref_name }}-${{ matrix.artifact }}-setup.exe.sig" }
          Get-ChildItem out

      - name: Collect macOS bundles
        if: startsWith(matrix.platform, 'macos')
        shell: bash
        run: |
          mkdir -p out
          bundle="src-tauri/target/${{ matrix.target }}/release/bundle"
          for f in "$bundle"/dmg/*.dmg; do
            [ -f "$f" ] || continue
            cp "$f" "out/AI-DAW-${{ github.ref_name }}-${{ matrix.artifact }}.dmg"
          done
          # 更新包：`.app.tar.gz`（+ 同名 .sig），由 `app` bundle 产出。
          for f in "$bundle"/macos/*.app.tar.gz "$bundle"/macos/*.app.tar.gz.sig; do
            [ -f "$f" ] || continue
            cp "$f" "out/AI-DAW-${{ github.ref_name }}-${{ matrix.artifact }}.app.tar.gz${f##*.app.tar.gz}"
          done
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: ai-daw-${{ matrix.artifact }}
          path: out/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # 更新日志由 git 历史生成：取完整历史与所有 tag，才能算出「上一个 tag」区间。
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: List collected artifacts
        run: ls -la artifacts

      - name: Generate changelog from git history
        run: node tools/release-notes.mjs --tag "$GITHUB_REF_NAME" --out changelog.md
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: Generate latest.json for the updater
        run: |
          node -e "
          const fs = require('fs');
          const tag = process.env.TAG;
          const base = 'https://github.com/' + process.env.REPO + '/releases/download/' + tag + '/';
          const files = fs.readdirSync('artifacts');
          const find = (suffix, mid) => files.find((f) => f.endsWith(suffix) && (!mid || f.includes(mid)));
          const platforms = {};
          const add = (key, fileSuffix, sigSuffix, mid) => {
            const f = find(fileSuffix, mid);
            const s = find(sigSuffix, mid);
            if (f && s) {
              platforms[key] = {
                signature: fs.readFileSync('artifacts/' + s, 'utf8').trim(),
                url: base + f,
              };
            }
          };
          add('windows-x86_64', '-setup.exe', '-setup.exe.sig');
          add('darwin-aarch64', '.app.tar.gz', '.app.tar.gz.sig', 'macos-arm64');
          add('linux-x86_64', 'linux-amd64.AppImage', 'linux-amd64.AppImage.sig');
          add('linux-aarch64', 'linux-arm64.AppImage', 'linux-arm64.AppImage.sig');
          fs.writeFileSync('artifacts/latest.json', JSON.stringify({
            version: tag.replace(/^v/, ''),
            notes: fs.readFileSync('changelog.md', 'utf8'),
            pub_date: new Date().toISOString(),
            platforms,
          }, null, 2));
          "
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}

      - name: Compose release body
        shell: bash
        run: |
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"
          {
            cat changelog.md
            echo
            echo "## 📦 Downloads"
            echo
            echo "👉 [Windows — installer (.msi)](${base}/AI-DAW-${GITHUB_REF_NAME}-windows-amd64.msi)"
            echo
            echo "👉 [Windows — setup (.exe)](${base}/AI-DAW-${GITHUB_REF_NAME}-windows-amd64-setup.exe)"
            echo
            echo "👉 [macOS — Apple Silicon (.dmg)](${base}/AI-DAW-${GITHUB_REF_NAME}-macos-arm64.dmg)"
            echo
            echo "👉 [Linux — x86_64 (.AppImage)](${base}/AI-DAW-${GITHUB_REF_NAME}-linux-amd64.AppImage)"
            echo
            echo "👉 [Linux — x86_64 (.deb)](${base}/AI-DAW-${GITHUB_REF_NAME}-linux-amd64.deb)"
            echo
            echo "👉 [Linux — arm64 (.AppImage)](${base}/AI-DAW-${GITHUB_REF_NAME}-linux-arm64.AppImage)"
            echo
            echo "👉 [Linux — arm64 (.deb)](${base}/AI-DAW-${GITHUB_REF_NAME}-linux-arm64.deb)"
            echo
            cat <<'EOF'
          ## 🍎 macOS：首次打开提示 / First launch

          **中文：** 应用为 ad-hoc 签名（未使用 Apple 开发者证书、未公证）。首次打开时 macOS 会提示「Apple 无法验证此 App」，这是正常现象：

          1. 在「访达」里**右键**点 App →「打开」→ 再点一次「打开」；
          2. 或打开「系统设置 → 隐私与安全性」，在下方点「仍要打开」。

          **EN:** The app is ad-hoc signed (not notarized), so macOS asks for confirmation on first launch. Right-click the app in Finder → **Open** → **Open** again, or go to System Settings → Privacy & Security → **Open Anyway**.

          > 只有在提示「App 已损坏，无法打开」（弹窗里没有「仍要打开」按钮）时，才需要执行：
          >
          > ```bash
          > xattr -cr "/Applications/AI DAW.app"
          > ```
          >
          > 执行后仍然报「已损坏」，说明安装包本身的签名是残缺的（打包期没签名）：请确认下载的是最新版本，本版本起打包时会自动做 ad-hoc 签名。
          EOF
          } > release-body.md

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ env.APP_NAME }} ${{ github.ref_name }}
          draft: false
          prerelease: false
          fail_on_unmatched_files: false
          body_path: release-body.md
          files: artifacts/*
