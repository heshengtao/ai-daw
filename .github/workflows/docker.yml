name: Docker (aidawd)

# 无头后端镜像：`aidawd` 只跑工程引擎 + HTTP API，不链 WebKit。
# 推送到：<DOCKERHUB_USERNAME>/ai-daw-aidawd
#
# 需要的仓库 Secrets：
#   DOCKERHUB_USERNAME  Docker Hub 账号
#   DOCKERHUB_TOKEN     Docker Hub Access Token（Read & Write）
#
# 标签规则：
#   main 分支   → latest、sha-<短 sha>
#   v1.7.0 tag  → 1.7.0、1.7、latest、sha-<短 sha>
#   手动触发    → sha-<短 sha>
#
# 架构：amd64 与 arm64 各用一台**原生** runner 构建（不走 QEMU —— Rust 全量 release
# 编译在模拟层里要一小时起步），最后由 `imagetools create` 合成多架构 manifest。

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

env:
  IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/ai-daw-aidawd

jobs:
  preflight:
    name: check secrets
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - id: check
        env:
          USER: ${{ secrets.DOCKERHUB_USERNAME }}
          TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -n "${USER}" ] && [ -n "${TOKEN}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::仓库还没配 DOCKERHUB_USERNAME / DOCKERHUB_TOKEN，跳过镜像发布"
          fi

  build:
    name: build (${{ matrix.arch }})
    needs: preflight
    if: needs.preflight.outputs.ready == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-latest
            arch: amd64
          - platform: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          # 只出「带架构后缀」的临时标签，公开的多架构标签在 merge 任务里合成。
          tags: |
            type=sha,format=short,prefix=,suffix=-${{ matrix.arch }}
            type=ref,event=branch,suffix=-${{ matrix.arch }}
            type=semver,pattern={{version}},suffix=-${{ matrix.arch }}

      - name: Build and push (single arch)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=aidawd-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=aidawd-${{ matrix.arch }}

  merge:
    name: multi-arch manifest
    needs: [preflight, build]
    if: needs.preflight.outputs.ready == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compose multi-arch tags
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          short="${SHA:0:7}"
          sources="${IMAGE}:sha-${short}-amd64 ${IMAGE}:sha-${short}-arm64"

          # 单架构构建各自推过 `:sha-<short>-<arch>`，这里合成不带后缀的 sha 标签。
          docker buildx imagetools create -t "${IMAGE}:sha-${short}" ${sources}

          if [ "${REF_TYPE}" = "tag" ]; then
            base="${REF_NAME#v}"          # v1.7.0 → 1.7.0
            minor="${base%.*}"            # 1.7.0 → 1.7
            tags="${base} latest"
            # `v2` 这种没有次版本号的 tag：`${base%.*}` 还是它自己，别重复发布。
            if [ "${minor}" != "${base}" ]; then
              tags="${base} ${minor} latest"
            fi
            for tag in ${tags}; do
              docker buildx imagetools create -t "${IMAGE}:${tag}" \
                "${IMAGE}:${base}-amd64" "${IMAGE}:${base}-arm64"
            done
            echo "已发布：${tags} sha-${short}"
          elif [ "${REF_NAME}" = "main" ]; then
            docker buildx imagetools create -t "${IMAGE}:latest" \
              "${IMAGE}:main-amd64" "${IMAGE}:main-arm64"
            echo "已发布：latest sha-${short}"
          else
            echo "已发布：sha-${short}（非 main 分支，只出 sha 标签）"
          fi
