# cargo-deny 配置：与 `docs/superpowers/ROADMAP.md` §3「许可证护栏（强制）」一一对应。
#
# 用法：`cargo install cargo-deny && cargo deny check licenses`
# （CI 接入仍是待办；目前靠本文件 + 人工核对。）

[licenses]
# 允许清单：MIT / Apache-2.0 / BSD-2 / BSD-3 / ISC / CC0 / Zlib / Unlicense
#           + MPL-2.0（仅限「未修改的依赖」，见 ROADMAP §3）。
# 禁止：GPL / AGPL / SSPL / ASIO 专有件；LGPL 需单独评估。
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "CC0-1.0",
    "Zlib",
    "Unlicense",
    "MPL-2.0",
]
# 低于该置信度的许可证判定（如文件头兜底）视为不确定 → 报错，逼人显式确认。
confidence-threshold = 0.8

# ---- 许可证例外（只对列出的 crate 生效） ----
#
# MP3 导出（`crates/engine/src/mp3.rs`）用 `mp3lame-encoder`，它封装的是**原封不动**的
# LAME 3.100（LGPL-3.0）。评估结论：只作为未修改的第三方库参与链接——本项目既不分发它的
# 源码改动，也没有把它并进本项目的源文件，声明写在 `NOTICE`；「不改动它」正是 LGPL 允许
# 这样用的前提。
#
# 例外**只覆盖这两个 crate**：其它依赖再引入 LGPL 依旧会在 `cargo deny check licenses` 报错，
# 所以护栏还在，只是多了这一处显式签字。要换掉 / 升级 LAME，改这里即可。
[[licenses.exceptions]]
crate = "mp3lame-encoder"
allow = ["LGPL-3.0"]

[[licenses.exceptions]]
crate = "mp3lame-sys"
allow = ["LGPL-3.0"]
