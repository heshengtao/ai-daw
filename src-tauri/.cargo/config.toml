# Cargo 的 `runner`：**只在「运行」测试可执行文件时**插一手，不改任何链接参数。
#
# 为什么需要：Windows 上测试壳没有应用清单，而 `tauri-plugin-dialog` → `rfd` 静态导入
# `comctl32!TaskDialogIndirect`，加载器就绑到 System32 的 comctl32 5.82（没有这个导出），
# 进程在第一个用例之前就死在 `STATUS_ENTRYPOINT_NOT_FOUND (0xc0000139)`。
#
# 为什么不用 `build.rs` + `rustc-link-arg`：那会把清单也嵌进**正式 App**，而 `tauri-build`
# 给 App 嵌的 resource.lib 里已经有一份，`link.exe` 直接报 `CVT1100: 资源重复 (MANIFEST)`
# + `LNK1123`；`rustc-link-arg-tests` 又只覆盖 `tests/` 那种独立 test target，管不到 lib
# 自己的单元测试壳。runner 是唯一「只作用于运行测试」的挂载点。
#
# 注意：Cargo 从**当前目录**向上找 `.cargo/config.toml`，所以这份配置只在
# `cd src-tauri && cargo test` 时生效（`pnpm tauri dev` 从仓库根跑、也不会被 runner 绕一层）。
# 脚本对 `cargo run` 之类（`target\<profile>\` 下、不在 `deps\` 里的可执行文件）原样穿透。
[target.'cfg(windows)']
runner = "powershell -NoProfile -ExecutionPolicy Bypass -File tools/test-runner.ps1"
