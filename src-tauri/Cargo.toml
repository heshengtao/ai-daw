[package]
name = "daw-party-app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"
license = "Apache-2.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "daw_party_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
daw-party-engine = { path = "../crates/engine", features = ["realtime"] }
daw-party-plugin-api = { path = "../crates/plugin-api" }
daw-party-host-vst3 = { path = "../crates/host-vst3" }
daw-party-analysis = { path = "../crates/analysis" }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true

# Opt out of the repository-root Cargo workspace: this crate is its own
# workspace root and is therefore not built by `cargo test --workspace`.
[workspace]
