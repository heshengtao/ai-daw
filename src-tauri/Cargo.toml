[package]
name = "ai-daw"
version = "1.8.0"
description = "AI DAW 桌面外壳：窗口、原生插件编辑器与自动更新"
authors = ["you"]
edition = "2021"
license = "Apache-2.0"

# See more keys and their definitions at https://doc.tauri.app/develop/

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "ai_daw_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# 外壳只负责窗口、原生菜单/对话框与自动更新；业务全部在 `ai-daw-daemon` 里。
tauri = { version = "2", features = [] }
chrono = "0.4"
tauri-plugin-dialog = "2"
# 自动更新：桌面端从 GitHub Releases 的 `latest.json` 取新版本，验签后安装；
# 装完用 `process` 插件重启到新版本。端点 / 公钥在 `tauri.conf.json` 的 `plugins.updater`。
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ai-daw-daemon = { path = "../crates/daemon" }
# 外壳直接叫用到的两处宿主 crate 接口（日志宿、模型目录登记）。
ai-daw-host-vst3 = { path = "../crates/host-vst3" }
ai-daw-engine = { path = "../crates/engine", features = ["realtime"] }
ai-daw-local-ai = { path = "../crates/local-ai" }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true

# `rten`（Beat This! 的纯 Rust 推理后端）在未优化的 debug 下慢到不可用。
# 本 crate 是**独立 workspace**，仓库根的同一段 profile 覆盖不到这里，必须自己再写一遍。
[profile.dev.package.rten]
opt-level = 3
[profile.dev.package.rten-base]
opt-level = 3
[profile.dev.package.rten-gemm]
opt-level = 3
[profile.dev.package.rten-model-file]
opt-level = 3
[profile.dev.package.rten-onnx]
opt-level = 3
[profile.dev.package.rten-shape-inference]
opt-level = 3
[profile.dev.package.rten-simd]
opt-level = 3
[profile.dev.package.rten-tensor]
opt-level = 3
[profile.dev.package.rten-vecmath]
opt-level = 3

# 内置采样音色（SF3）的 Ogg Vorbis 解码：纯浮点 / 位流运算，debug 下慢一个数量级。
# 第一次用到采样乐器要解一遍 PCM；未优化时 `builtin.piano` / `builtin.nylon_guitar`
# 各自能吃掉 1~2 秒，加起来就是用户说的「启动卡顿」。与上面 rten 同理：本 crate 是
# 独立 workspace，仓库根的同名段落在 `tauri dev` 的构建里不生效，必须在这里再写一遍。
[profile.dev.package.lewton]
opt-level = 3
[profile.dev.package.ogg]
opt-level = 3
[profile.dev.package.rustysynth-ext]
opt-level = 3

# Opt out of the repository-root Cargo workspace: this crate is its own
# workspace root and is therefore not built by `cargo test --workspace`.
[workspace]
