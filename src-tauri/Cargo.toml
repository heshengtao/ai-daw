[package]
name = "ai-daw-app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"
license = "Apache-2.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "ai_daw_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ai-daw-engine = { path = "../crates/engine", features = ["realtime"] }
ai-daw-plugin-api = { path = "../crates/plugin-api" }
ai-daw-host-vst3 = { path = "../crates/host-vst3" }
ai-daw-analysis = { path = "../crates/analysis" }
ai-daw-asset = { path = "../crates/asset" }
# 本地 AI（音频转 MIDI / 降噪）：内置 DSP，不依赖外部模型。
ai-daw-local-ai = { path = "../crates/local-ai" }
# 内嵌 MCP 服务器（Streamable HTTP，只监听回环）。
rmcp = { version = "3", features = [
    "server",
    "macros",
    "schemars",
    "transport-streamable-http-server",
] }
axum = "0.8"
tokio = { version = "1", features = ["net"] }
tokio-util = "0.7"
schemars = "1"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true

# Opt out of the repository-root Cargo workspace: this crate is its own
# workspace root and is therefore not built by `cargo test --workspace`.
[workspace]
