[package]
name = "daw-party-engine"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
realtime = ["dep:cpal"]

[dependencies]
daw-party-ipc = { path = "../ipc" }
daw-party-plugin-api = { path = "../plugin-api" }
daw-party-synth = { path = "../synth" }
serde = { version = "1", features = ["derive"] }
thiserror = "1"
hound = "3"
rtrb = "0.4"
cpal = { version = "0.18", optional = true }

[dev-dependencies]
serde_json = "1"
tempfile = "3"

[[example]]
name = "play_demo"
required-features = ["realtime"]
