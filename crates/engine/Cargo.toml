[package]
name = "daw-party-engine"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
realtime = ["dep:cpal"]

[dependencies]
daw-party-ipc = { path = "../ipc" }
daw-party-plugin-api = { path = "../plugin-api" }
daw-party-synth = { path = "../synth" }
daw-party-effects = { path = "../effects" }
serde = { version = "1", features = ["derive"] }
thiserror = "1"
hound = "3"
rtrb = "0.4"
cpal = { version = "0.18", optional = true }

[dev-dependencies]
serde_json = "1"
tempfile = "3"
# 「听感」断言用：把渲染结果做频谱/峰值/RMS 的量化核对，而不是「>0 就算过」。
daw-party-analysis = { path = "../analysis" }

[[example]]
name = "play_demo"
required-features = ["realtime"]
