[package]
name = "ai-daw-extensions"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "AI DAW 的扩展插件运行时：包格式、QuickJS 宿主、注册表、市场与安装"

[lib]
name = "ai_daw_extensions"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }
rquickjs = { version = "0.14", features = ["std"] }
# npm tarball（tar.gz）与索引缓存 IO 用。
flate2 = "1"
tar = "0.4"
sha2 = "0.10"
base64 = "0.22"
sha1 = "0.10"
url = "2"
ureq = { version = "3", default-features = false, features = ["native-tls", "gzip", "socks-proxy"] }

[dev-dependencies]
tempfile = "3"
