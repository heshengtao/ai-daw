[package]
name = "ai-daw-local-ai"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# **运行期加载**（`load-dynamic`）而不是静态链接：
# `ort-sys` 的 build 脚本在 `disable-linking` 下**直接 return**——不下载预编译包、不链接、
# 不解析 dist 的特性集，于是 EP 特性只是纯 API 开关，不会因为「平台没有对应构建」而炸。
# ONNX Runtime 本体由 `backend::runtime` 从应用配置目录里的 `runtime/ort/<id>/` 加载，
# 也就可以「装 CPU 一份，CUDA 按需下载」。
#
# `api-24`：锁定 C API 的低水位（ORT 1.24 起都能加载，含 1.30），这样 DirectML 那份
# 只发布到 1.24 的构建也能用。升级 ORT 时把 `backend::runtime::ORT_VERSION` 一起换。
ort = { version = "2.0.0-rc.13", default-features = false, features = [
    "std",
    "half",
    "load-dynamic",
    "api-24",
] }
# 半精度张量：fp16 导出的 9 张图（歌声合成）在边界上要 f16 ↔ f32 转换。
half = "2"
# 频谱：窗函数 + FFT（与 `crates/analysis` 同一个库，MIT OR Apache-2.0）。
rustfft = "6"
# 节拍 / 重拍检测：Beat This!（ISMIR 2024，MIT）的 Rust 移植。默认后端 `rten`
# 是纯 Rust、不需要任何系统库（`ort` 后端要 libonnxruntime，这里不启用）。
# 只当库用：关掉 `cli` / `decode`——音频已经在本地解码成 f32，直接喂单声道采样即可。
beat-this = { version = "1", default-features = false }

# 执行后端的 API gate。`load-dynamic` 之后特性集不再受 dist 约束，**按平台全开**即可：
# 拿到的是运行时那一份 dylib 里真实编进去的 EP，注册不上就回落到 CPU（见 session.rs）。
# **macOS 保持静态链接**：它没有 CUDA，不需要运行期换 dylib；而且静态链接时 ONNX Runtime
# 的代码本来就在 app 里（安装包大小不变），改成随包 dylib 反而多一个文件、多一次加载。
[target.'cfg(target_os = "macos")'.dependencies]
ort = { version = "2.0.0-rc.13", default-features = false, features = [
    "std",
    "half",
    "api-24",
    "coreml",
    "download-binaries",
    "tls-native",
] }

[target.'cfg(target_os = "windows")'.dependencies]
ort = { version = "2.0.0-rc.13", default-features = false, features = [
    "std",
    "half",
    "load-dynamic",
    "api-24",
    "cuda",
    "directml",
] }

[target.'cfg(target_os = "linux")'.dependencies]
ort = { version = "2.0.0-rc.13", default-features = false, features = [
    "std",
    "half",
    "load-dynamic",
    "api-24",
    "cuda",
] }

[dev-dependencies]
